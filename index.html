    <!-- Critical styles for the opening preloader, inline so it looks right before the main CSS or JS arrives. -->
    <style>
      #preloader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 16px;
        background: var(--color-bg, #f4f6f2); transition: opacity .6s cubic-bezier(.2,.7,.2,1), visibility .6s; }
      #preloader.is-done { opacity: 0; visibility: hidden; }
      #preloader .preloader-label { font-family: "Italiana", "Didot", Georgia, serif; font-size: 24px; color: var(--color-accent-text, #3f5a4d); }
      #preloader .buddha-breathe { transform-origin: 50% 90%; animation: buddha-breathe 4s ease-in-out infinite; }
      #preloader .buddha-ring { transform-origin: 50% 50%; animation: buddha-turn 10s linear infinite; }
      @keyframes buddha-breathe { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.04); } }
      @keyframes buddha-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #preloader .buddha-breathe, #preloader .buddha-ring { animation: none; } }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>
